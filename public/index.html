<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONLY PLAY · 只有声音的美术馆</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <script>
    // 提前落主题，避免闪白
    (function () {
      try {
        var t = localStorage.getItem('op-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- 入口幕布：一次点击解锁自动播放，如同检票入馆 -->
  <div id="curtain">
    <div class="curtain-inner">
      <div class="curtain-mark">ONLY&nbsp;PLAY</div>
      <div class="curtain-sub">一所只有声音的美术馆</div>
      <button id="enterBtn">入&nbsp;&nbsp;馆</button>
      <div class="curtain-hint">点击入馆后开始播放 · 建议打开声音</div>
    </div>
  </div>

  <header id="topbar">
    <div class="wordmark">ONLY&nbsp;PLAY</div>
    <nav>
      <button class="navlink" data-view="player">展&nbsp;厅</button>
      <button class="navlink" data-view="albums">专&nbsp;辑</button>
      <button class="navlink" data-view="library">曲&nbsp;库</button>
      <button class="navlink" data-view="upload">入&nbsp;藏</button>
      <button id="themeBtn" aria-label="切换白天 / 夜间" title="切换白天 / 夜间">
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M20.4 13.2A8.4 8.4 0 1 1 10.8 3.6a6.8 6.8 0 0 0 9.6 9.6z"/></svg>
      </button>
    </nav>
  </header>

  <main id="stage">

    <!-- 展厅：播放 + 歌词 -->
    <section id="view-player" class="view">
      <aside class="label-card">
        <div class="no">No.<span id="p-no">—</span></div>
        <div id="p-cover" data-mode="letter">
          <img id="p-cover-img" alt="封面">
          <span id="p-cover-letter" class="letter">乐</span>
        </div>
        <h1 id="p-title">静候入藏</h1>
        <div id="p-artist">曲库尚无藏品</div>
        <div id="p-meta"></div>
      </aside>
      <div class="lyrics-stage" id="lyrics">
        <div id="lyrics-inner"></div>
      </div>
    </section>

    <!-- 专辑 -->
    <section id="view-albums" class="view">
      <div id="alb-wrap"></div>
    </section>

    <!-- 曲库 -->
    <section id="view-library" class="view">
      <div class="lib-head">
        <h2 class="view-title">曲&nbsp;库</h2>
        <div class="lib-head-btns">
          <div class="lib-toggle" id="libToggle">
            <button id="mode-songs" class="tb-btn on">全部歌曲</button>
            <button id="mode-albums" class="tb-btn">专辑列表</button>
          </div>
          <button id="coverBtn" class="tb-btn" hidden>补&nbsp;封&nbsp;面</button>
          <button id="editBtn" class="tb-btn">编&nbsp;辑</button>
        </div>
      </div>
      <div id="lib-toolbar" hidden>
        <button id="sel-all" class="sel-all"><span class="cbox"></span>全&nbsp;选</button>
        <span id="sel-count" class="sel-count"></span>
        <span class="tb-flex"></span>
        <button id="batch-del" class="tb-btn danger">移&nbsp;除</button>
        <button id="edit-done" class="tb-btn">完&nbsp;成</button>
      </div>
      <div id="song-list"></div>
    </section>

    <!-- 入藏 -->
    <section id="view-upload" class="view">
      <h2 class="view-title">入&nbsp;藏</h2>
      <div id="dropzone" role="button" tabindex="0">
        <div class="dz-mark">＋</div>
        <p>将 MP3 与 LRC 文件拖入此处</p>
        <p class="dz-sub">同名文件自动配对 · 也可点击选择</p>
        <input type="file" id="fileInput" multiple accept=".mp3,.lrc" hidden>
      </div>
      <div id="upload-progress"></div>
      <div id="pending-section" hidden>
        <h3>待配对歌词</h3>
        <div id="pending-list"></div>
      </div>
    </section>

  </main>

  <!-- 底部播放条 -->
  <footer id="playerbar">
    <div class="pb-left">
      <span class="pb-no" id="pb-no"></span>
      <div class="pb-titlewrap">
        <div class="pb-title" id="pb-title">—</div>
        <div class="pb-artist" id="pb-artist"></div>
      </div>
    </div>
    <div class="pb-center">
      <div class="pb-times"><span id="t-cur">0:00</span><span id="t-total">0:00</span></div>
      <div class="pb-line" id="progress">
        <div class="pb-fill" id="progress-fill"></div>
        <div class="pb-dot" id="progress-dot"></div>
      </div>
    </div>
    <div class="pb-right">
      <button class="ctrl" id="prevBtn" title="上一首">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2v14H7zm12 0v14l-9-7z"/></svg>
      </button>
      <button class="ctrl big" id="playBtn" title="播放 / 暂停">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl" id="nextBtn" title="下一首">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 5h2v14h-2zM5 5v14l9-7z"/></svg>
      </button>
    </div>
  </footer>

  <div id="toast"></div>
  <audio id="audio" preload="metadata"></audio>
  <script src="/app.js"></script>
</body>
</html>
